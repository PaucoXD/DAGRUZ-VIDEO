<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 500; src: url(assets/fonts/montserrat-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url(assets/fonts/montserrat-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url(assets/fonts/montserrat-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url(assets/fonts/montserrat-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "JB"; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #09090c; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Montserrat", sans-serif; }
      /* Fondo de tormenta, igual que la página */
      #bg { position: absolute; inset: 0; overflow: hidden; }
      #bg-clouds { position: absolute; inset: -6%; background: url(assets/img/bg-clouds-m.webp) center / cover no-repeat; }
      #bg-fog { position: absolute; top: 30%; left: -20%; width: 160%; height: 60%; background: url(assets/img/bg-fog.webp) center / 100% 100% no-repeat; mix-blend-mode: screen; opacity: 0.35; -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 30%, transparent 100%); }
      #bg-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(9, 9, 12, 0.55) 0%, rgba(9, 9, 12, 0.35) 45%, rgba(9, 9, 12, 0.75) 100%); }
      #grain { position: absolute; inset: -50%; background: url(assets/img/grain.png); opacity: 0.07; mix-blend-mode: overlay; pointer-events: none; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.55) 100%); pointer-events: none; }
      #wipe { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .wp { position: absolute; top: -200px; height: 2320px; transform: skewX(-18deg); }
      #wp1 { width: 1500px; background: #e3000f; left: -1900px; }
      #wp2 { width: 1300px; background: #09090c; left: -1800px; }
      #wp3 { width: 40px; background: #ffffff; left: -1950px; }
      #flash { position: absolute; inset: 0; background: radial-gradient(circle at 60% 18%, rgba(220, 200, 255, 0.95), rgba(150, 110, 255, 0.35) 45%, transparent 75%); opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.8" data-width="1080" data-height="1920">
      <div id="bg">
        <div id="bg-clouds"></div>
        <div id="bg-fog"></div>
        <div id="bg-shade"></div>
      </div>

      <!-- Escenas -->
      <div id="gancho" data-composition-id="gancho" data-composition-src="compositions/gancho.html"
        data-start="0" data-duration="3.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="ocho" data-composition-id="ocho" data-composition-src="compositions/ocho.html"
        data-start="3.4" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="diseno" data-composition-id="diseno" data-composition-src="compositions/diseno.html"
        data-start="6.5" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cotiza" data-composition-id="cotiza" data-composition-src="compositions/cotiza.html"
        data-start="12.1" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html"
        data-start="15.2" data-duration="4.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="flash"></div>
      <div id="vig"></div>
      <div id="grain"></div>
      <div id="wipe" data-layout-allow-overflow><div class="wp" id="wp1" data-layout-allow-overflow></div><div class="wp" id="wp2" data-layout-allow-overflow></div><div class="wp" id="wp3" data-layout-allow-overflow></div></div>

      <!-- Voz (ElevenLabs, Antonio) -->
      <audio id="voz" class="clip" src="assets/voz/voz.mp3" data-start="0.3" data-duration="17.3" data-track-index="2" data-volume="1"></audio>

      <!-- Música (ElevenLabs Music) -->
      <audio id="musica" class="clip" src="assets/musica/beat-draguz-29.mp3" data-start="0" data-duration="19.8"
        data-fade-in="0.3" data-fade-out="1.4" data-track-index="4" data-volume="0.2"></audio>

      <!-- Efectos -->
      <audio id="w0" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0" data-duration="0.57" data-track-index="5" data-volume="0.3"></audio>
      <audio id="p1" class="clip" src="assets/sfx/pop.mp3" data-start="1.2" data-duration="0.7" data-track-index="6" data-volume="0.35"></audio>
      <audio id="p2" class="clip" src="assets/sfx/pop.mp3" data-start="2.05" data-duration="0.7" data-track-index="7" data-volume="0.35"></audio>
      <audio id="p3" class="clip" src="assets/sfx/pop.mp3" data-start="2.7" data-duration="0.7" data-track-index="8" data-volume="0.35"></audio>
      <audio id="w1" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.2" data-duration="0.57" data-track-index="5" data-volume="0.35"></audio>
      <audio id="c1" class="clip" src="assets/sfx/click.mp3" data-start="3.5" data-duration="0.36" data-track-index="6" data-volume="0.4"></audio>
      <audio id="c2" class="clip" src="assets/sfx/click.mp3" data-start="3.85" data-duration="0.36" data-track-index="7" data-volume="0.4"></audio>
      <audio id="imp1" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="5.15" data-duration="1.2" data-track-index="8" data-volume="0.45"></audio>
      <audio id="w2" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.3" data-duration="0.57" data-track-index="5" data-volume="0.35"></audio>
      <audio id="p4" class="clip" src="assets/sfx/pop.mp3" data-start="7.23" data-duration="0.7" data-track-index="6" data-volume="0.4"></audio>
      <audio id="c3" class="clip" src="assets/sfx/click.mp3" data-start="8.34" data-duration="0.36" data-track-index="7" data-volume="0.4"></audio>
      <audio id="c4" class="clip" src="assets/sfx/click.mp3" data-start="9.26" data-duration="0.36" data-track-index="8" data-volume="0.4"></audio>
      <audio id="c5" class="clip" src="assets/sfx/click.mp3" data-start="10.62" data-duration="0.36" data-track-index="5" data-volume="0.4"></audio>
      <audio id="w3" class="clip" src="assets/sfx/whoosh.mp3" data-start="11.9" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
      <audio id="p5" class="clip" src="assets/sfx/pop.mp3" data-start="12.15" data-duration="0.7" data-track-index="7" data-volume="0.35"></audio>
      <audio id="p6" class="clip" src="assets/sfx/pop.mp3" data-start="13.5" data-duration="0.7" data-track-index="8" data-volume="0.35"></audio>
      <audio id="w4" class="clip" src="assets/sfx/whoosh.mp3" data-start="14.95" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
      <audio id="imp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="15.25" data-duration="2.1" data-track-index="5" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Tormenta que respira todo el video
      tl.fromTo("#bg-clouds", { scale: 1 }, { scale: 1.12, x: -30, duration: 19.8, ease: "none" }, 0);
      tl.fromTo("#bg-fog", { x: 0 }, { x: -260, duration: 19.8, ease: "none" }, 0);
      // Rayos en los golpes del video
      const rayo = (t, f = 1, first = false) => {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85 * f, duration: 0.05, ease: "none", immediateRender: first }, t);
        tl.to("#flash", { opacity: 0.15 * f, duration: 0.07, ease: "none" }, t + 0.05);
        tl.to("#flash", { opacity: 0.6 * f, duration: 0.05, ease: "none" }, t + 0.13);
        tl.to("#flash", { opacity: 0, duration: 0.5, ease: "power2.out" }, t + 0.18);
      };
      rayo(5.15, 0.5, false);
      rayo(15.25);
      // Grano de pelicula que salta cada frame
      for (let i = 0; i < 19.8 * 12; i++) {
        tl.set("#grain", { x: ((i * 137) % 500) - 250, y: ((i * 251) % 500) - 250 }, i / 12);
      }
      // Barrido diagonal rojo/negro en cada corte de escena
      const wipe = (t) => {
        tl.fromTo("#wp1", { x: 0 }, { x: 4200, duration: 0.62, ease: "power3.inOut", immediateRender: false }, t - 0.31);
        tl.fromTo("#wp2", { x: 0 }, { x: 4200, duration: 0.62, ease: "power3.inOut", immediateRender: false }, t - 0.25);
        tl.fromTo("#wp3", { x: 0 }, { x: 4300, duration: 0.62, ease: "power3.inOut", immediateRender: false }, t - 0.33);
      };
      [3.4, 6.5, 12.1, 15.2].forEach(wipe);
      // Golpe de camara en los impactos
      const kick = (t) => { tl.fromTo("#bg-clouds", { y: 0 }, { y: 18, duration: 0.05, repeat: 5, yoyo: true, ease: "none", immediateRender: false }, t); };
      [5.15, 15.25].forEach(kick);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
