      #flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; }

      <audio id="fx0" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0" data-duration="0.57" data-track-index="5" data-volume="0.3"></audio>
      <audio id="fx1" class="clip" src="assets/sfx/pop.mp3" data-start="1.25" data-duration="0.7" data-track-index="6" data-volume="0.35"></audio>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Destello de camara en los golpes
      [2.97, 16.77, 26.97].forEach((t) => {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.7, duration: 0.04, ease: "none", immediateRender: false }, t);
        tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, t + 0.04);
      });
      window.__timelines["main"] = tl;
    </script>
