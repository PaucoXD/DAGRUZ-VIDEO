<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 500; src: url(assets/fonts/montserrat-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url(assets/fonts/montserrat-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url(assets/fonts/montserrat-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url(assets/fonts/montserrat-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "JB"; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d0d0f; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Montserrat", sans-serif; }
      #flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.5" data-width="1080" data-height="1920">
      <!-- Paginas de la revista -->
      <div id="portada" data-composition-id="portada" data-composition-src="compositions/portada.html"
        data-start="0" data-duration="2.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="heroe" data-composition-id="heroe" data-composition-src="compositions/heroe.html"
        data-start="2.0" data-duration="3.5" data-track-index="9" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="rayo" data-composition-id="rayo" data-composition-src="compositions/rayo.html"
        data-start="5.2" data-duration="1.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="calle" data-composition-id="calle" data-composition-src="compositions/calle.html"
        data-start="6.7" data-duration="1.6" data-track-index="9" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="estampa" data-composition-id="estampa" data-composition-src="compositions/estampa.html"
        data-start="8.0" data-duration="2.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="web" data-composition-id="web" data-composition-src="compositions/web.html"
        data-start="10.3" data-duration="4.0" data-track-index="9" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="contra" data-composition-id="contra" data-composition-src="compositions/contra.html"
        data-start="14.0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="flash"></div>

      <!-- Voz (ElevenLabs, Antonio) -->
      <audio id="voz" class="clip" src="assets/voz/voz.mp3" data-start="0.3" data-duration="16.48" data-track-index="2" data-volume="1"></audio>

      <!-- Música (ElevenLabs Music) -->
      <audio id="musica" class="clip" src="assets/musica/beat-draguz-29.mp3" data-start="0" data-duration="18.5"
        data-fade-in="0.3" data-fade-out="1.4" data-track-index="4" data-volume="0.2"></audio>

      <!-- Efectos -->
      <audio id="w0" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.0" data-duration="0.57" data-track-index="5" data-volume="0.3"></audio>
      <audio id="w1" class="clip" src="assets/sfx/whoosh.mp3" data-start="1.85" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
      <audio id="imp1" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.3" data-duration="1.4" data-track-index="7" data-volume="0.5"></audio>
      <audio id="p1" class="clip" src="assets/sfx/pop.mp3" data-start="3.75" data-duration="0.7" data-track-index="8" data-volume="0.35"></audio>
      <audio id="w2" class="clip" src="assets/sfx/whoosh.mp3" data-start="5.05" data-duration="0.57" data-track-index="5" data-volume="0.4"></audio>
      <audio id="w3" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.55" data-duration="0.57" data-track-index="6" data-volume="0.35"></audio>
      <audio id="w4" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.85" data-duration="0.57" data-track-index="7" data-volume="0.35"></audio>
      <audio id="p2" class="clip" src="assets/sfx/pop.mp3" data-start="8.9" data-duration="0.7" data-track-index="8" data-volume="0.35"></audio>
      <audio id="w5" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.15" data-duration="0.57" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sp" class="clip" src="assets/sfx/sparkle.mp3" data-start="12.5" data-duration="1.0" data-track-index="6" data-volume="0.35"></audio>
      <audio id="w6" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.85" data-duration="0.57" data-track-index="7" data-volume="0.35"></audio>
      <audio id="imp2" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="14.38" data-duration="2.0" data-track-index="8" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Destello de camara en los golpes
      [2.3, 14.38].forEach((t) => {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.7, duration: 0.04, ease: "none", immediateRender: false }, t);
        tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, t + 0.04);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
