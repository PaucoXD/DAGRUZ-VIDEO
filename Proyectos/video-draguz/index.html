<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 500; src: url(assets/fonts/montserrat-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url(assets/fonts/montserrat-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url(assets/fonts/montserrat-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url(assets/fonts/montserrat-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "JB"; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #09090c; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Montserrat", sans-serif; }
      /* Fondo de tormenta, igual que la página */
      #bg { position: absolute; inset: 0; overflow: hidden; }
      #bg-clouds { position: absolute; inset: -6%; background: url(assets/img/bg-clouds-m.webp) center / cover no-repeat; }
      #bg-fog { position: absolute; top: 30%; left: -20%; width: 160%; height: 60%; background: url(assets/img/bg-fog.webp) center / 100% 100% no-repeat; mix-blend-mode: screen; opacity: 0.35; -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 30%, transparent 100%); }
      #bg-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(9, 9, 12, 0.55) 0%, rgba(9, 9, 12, 0.35) 45%, rgba(9, 9, 12, 0.75) 100%); }
      #flash { position: absolute; inset: 0; background: radial-gradient(circle at 60% 18%, rgba(220, 200, 255, 0.95), rgba(150, 110, 255, 0.35) 45%, transparent 75%); opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.1" data-width="1080" data-height="1920">
      <div id="bg">
        <div id="bg-clouds"></div>
        <div id="bg-fog"></div>
        <div id="bg-shade"></div>
      </div>

      <!-- Escenas -->
      <div id="gancho" data-composition-id="gancho" data-composition-src="compositions/gancho.html"
        data-start="0" data-duration="2.95" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="algodon" data-composition-id="algodon" data-composition-src="compositions/algodon.html"
        data-start="2.95" data-duration="5.75" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="corte" data-composition-id="corte" data-composition-src="compositions/corte.html"
        data-start="8.7" data-duration="2.76" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="dtf" data-composition-id="dtf" data-composition-src="compositions/dtf.html"
        data-start="11.46" data-duration="3.88" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="personaliza" data-composition-id="personaliza" data-composition-src="compositions/personaliza.html"
        data-start="15.34" data-duration="2.28" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html"
        data-start="17.62" data-duration="5.48" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="flash"></div>

      <!-- Voz (ElevenLabs, Antonio) -->
      <audio id="voz" class="clip" src="assets/voz/voz.mp3" data-start="0.3" data-duration="19.52" data-track-index="2" data-volume="1"></audio>

      <!-- Música (ElevenLabs Music) -->
      <audio id="musica" class="clip" src="assets/musica/beat-draguz.mp3" data-start="0" data-duration="23.1"
        data-fade-in="0.3" data-fade-out="1.4" data-track-index="4" data-volume="0.2"></audio>

      <!-- Efectos -->
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.05" data-duration="0.57" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-impact-1" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="3.95" data-duration="1.5" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.5" data-duration="0.57" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="6.22" data-duration="0.7" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop.mp3" data-start="6.82" data-duration="0.7" data-track-index="6" data-volume="0.3"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/sfx/pop.mp3" data-start="7.58" data-duration="0.7" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.65" data-duration="0.57" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sfx-click-1" class="clip" src="assets/sfx/click.mp3" data-start="9.98" data-duration="0.4" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-click-2" class="clip" src="assets/sfx/click.mp3" data-start="10.54" data-duration="0.4" data-track-index="7" data-volume="0.4"></audio>
      <audio id="sfx-whoosh-4" class="clip" src="assets/sfx/whoosh.mp3" data-start="11.41" data-duration="0.57" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="14.66" data-duration="0.6" data-track-index="6" data-volume="0.3"></audio>
      <audio id="sfx-whoosh-5" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="15.29" data-duration="1" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="16.4" data-duration="1.3" data-fade-in="0.3" data-track-index="5" data-volume="0.25"></audio>
      <audio id="sfx-impact-2" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="17.62" data-duration="1.8" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-stamp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="16.17" data-duration="0.8" data-track-index="8" data-volume="0.3"></audio>
      <audio id="sfx-pop-4" class="clip" src="assets/sfx/pop.mp3" data-start="20.32" data-duration="0.7" data-track-index="7" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Tormenta que respira todo el video
      tl.fromTo("#bg-clouds", { scale: 1 }, { scale: 1.12, x: -30, duration: 23.1, ease: "none" }, 0);
      tl.fromTo("#bg-fog", { x: 0 }, { x: -260, duration: 23.1, ease: "none" }, 0);
      // Rayos en los golpes del video
      const rayo = (t, f = 1, first = false) => {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85 * f, duration: 0.05, ease: "none", immediateRender: first }, t);
        tl.to("#flash", { opacity: 0.15 * f, duration: 0.07, ease: "none" }, t + 0.05);
        tl.to("#flash", { opacity: 0.6 * f, duration: 0.05, ease: "none" }, t + 0.13);
        tl.to("#flash", { opacity: 0, duration: 0.5, ease: "power2.out" }, t + 0.18);
      };
      rayo(3.95, 1, true);
      rayo(11.42, 0.5);
      rayo(17.62);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
